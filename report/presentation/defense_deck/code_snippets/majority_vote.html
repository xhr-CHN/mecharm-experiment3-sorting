<div class="card">
  <h1>问题三：G6 识别不稳定</h1>
  <div class="sub">4-of-6 majority vote</div>
  <pre><span class="var">highest</span> = <span class="fn">max</span>(counts.values())
<span class="var">winners</span> = [
    name <span class="kw">for</span> name, count <span class="kw">in</span> counts.items()
    <span class="kw">if</span> count == <span class="var">highest</span>
]

<span class="danger">if highest &lt; minimum_votes or len(winners) != 1:</span>
    <span class="danger">return None</span></pre>
  <div class="note">少于 4/6 票或出现平票时，不强行判断，直接触发安全停止。</div>
